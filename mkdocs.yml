site_name: Eric Bouchut
site_url: https://www.ericbouchut.com/en/

# English site. The French one is built separately from mkdocs.fr.yml.
# The two source trees are disjoint, so neither build can pick up the other's
# pages; the site root itself (CNAME, robots.txt, the language-detecting
# landing page) is owned by `root/` and copied in by the publish workflow.
docs_dir: docs/en
site_dir: site/en

theme:
  variant: modern
  language: en
  features:
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: lucide/sun
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme:  default
      primary: custom
      accent:  custom
      toggle:
        icon: lucide/moon
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme:  slate
      primary: custom
      accent:  custom
      toggle:
        icon: lucide/sun-moon
        name: Switch to auto (use System Preferences)

plugins:
  - search
  - blog:
      blog_toc: true
      post_date_format: long
      post_url_date_format: yyyy/MM/dd
      post_url_format: "{date}/{slug}"
  - glightbox
  - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - meta
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji 
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tilde
  - toc:
      permalink: true
      permalink_title: Link to this Header
      title: Headers on this Page
      toc_depth: 3

extra:
  # Language switcher. Every language is listed, current one included, so the
  # reader can get back from /fr/ — Material renders nothing useful otherwise.
  alternate:
    - name: English
      link: /en/
      lang: en
    - name: Français
      link: /fr/
      lang: fr
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ebouchut
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/ebouchut
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/ebouchut
    - icon: fontawesome/brands/mastodon
      link: https://ruby.social/@ebouchut

extra_css:
  - css/extra.css

nav:
  - Home: index.md
  - Blog: blog/index.md
  - About:
      - blog/about/index.md
      - LinkedIn: https://linkedin.com/in/ebouchut
      - GitHub: https://github.com/ebouchut
      - Twitter: https://twitter.com/ebouchut
      - Mastodon: https://ruby.social/@ebouchut
  - Résumé: blog/cv/index.md
  - Contact:
      - blog/contact/index.md
      - LinkedIn: https://linkedin.com/in/ebouchut
      - GitHub: https://github.com/ebouchut
      - Twitter: https://twitter.com/ebouchut
      - Mastodon: https://ruby.social/@ebouchut
  - Tags: blog/tags.md

repo_url: https://github.com/ebouchut/ebouchut.github.io
repo_name: ebouchut/ebouchut.github.io
