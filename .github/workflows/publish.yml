# Build the blog and deploy it to GitHub Pages on every push to main.
#
# Pages "Source" must be set to "GitHub Actions" (repo Settings > Pages).
# The gh-pages branch is not used by this workflow.
name: publish

on:
  push:
    branches:
      - main

# Least privilege: no `contents: write`. A short-lived OIDC token plus the
# Pages deploy scope are all this workflow needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel a run already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Build the site (strict)
        run: uv run zensical build --strict

      # Pack site/ and store it as a workflow artifact instead of pushing to gh-pages.
      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Hand the uploaded artifact to the Pages service; authenticates with the
      # OIDC token, so no repository write access is required.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

# Note: actions/configure-pages is not needed here — zensical takes the base
# path from `site_url` in mkdocs.yml.
