# Build the blog and deploy it to GitHub Pages on every push to main.
#
# Pages "Source" must be set to "GitHub Actions" (repo Settings > Pages).
# The gh-pages branch is not used by this workflow.
name: publish

on:
  push:
    branches:
      - main

# Least privilege: no `contents: write`. A short-lived OIDC token plus the
# Pages deploy scope are all this workflow needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel a run already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      # Two builds, two disjoint source trees. Order matters only in that both
      # must run before the artifact is packed; neither clears the other's
      # output, since each writes its own subdirectory of site/.
      - name: Build the English site (strict)
        run: uv run zensical build --strict

      - name: Build the French site (strict)
        run: uv run zensical build -f mkdocs.fr.yml --strict

      # Everything that must sit at the site root belongs to neither language
      # build: the language-detecting landing page, the shared stylesheet, and
      # the files GitHub Pages and search engines read from the root
      # (CNAME, robots.txt, the Google verification file).
      - name: Copy the root files into the site
        run: cp -R root/. site/

      # Pack site/ and store it as a workflow artifact instead of pushing to gh-pages.
      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Hand the uploaded artifact to the Pages service; authenticates with the
      # OIDC token, so no repository write access is required.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

# Note: actions/configure-pages is not needed here — zensical takes the base
# path from `site_url` in mkdocs.yml.
