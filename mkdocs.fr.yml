site_name: Eric Bouchut
site_url: https://www.ericbouchut.com/fr/

# French site. Mirror of mkdocs.yml, which builds the English one.
# Only the keys that must differ are changed; everything else is kept in sync
# with mkdocs.yml by hand — there is no include mechanism in mkdocs.yml.
docs_dir: docs/fr
site_dir: site/fr

theme:
  variant: modern
  language: fr
  features:
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: lucide/sun
        name: Passer au thème clair
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme:  default
      primary: custom
      accent:  custom
      toggle:
        icon: lucide/moon
        name: Passer au thème sombre
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme:  slate
      primary: custom
      accent:  custom
      toggle:
        icon: lucide/sun-moon
        name: Suivre les préférences du système

plugins:
  - search
  # Zensical has not ported the blog plugin yet, so this block is inert: posts
  # publish at blog/posts/<filename>/ and post_url_format is ignored. Kept in
  # sync with mkdocs.yml so both sites behave identically once it lands.
  - blog:
      blog_toc: true
      post_date_format: long
      post_url_date_format: yyyy/MM/dd
      post_url_format: "{date}/{slug}"
  - glightbox
  - redirects:
      redirect_maps:
        blog/2021/07/22/git-stash-internals/index.md: blog/posts/2021-07-22-git-stash-internals.md
        blog/2021/07/14/git_checkout_dash.md:         blog/posts/2021-07-14-git_checkout_dash.md
        blog/2021/07/14/go-to-the-previous-branch-with-git-checkout.md: blog/posts/2021-07-14-git_checkout_dash.md 
  - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - meta
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tilde
  - toc:
      permalink: true
      permalink_title: Lien vers ce titre
      title: Sur cette page
      toc_depth: 3

extra:
  alternate:
    - name: English
      link: /en/
      lang: en
    - name: Français
      link: /fr/
      lang: fr
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ebouchut
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/ebouchut
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/ebouchut
    - icon: fontawesome/brands/mastodon
      link: https://ruby.social/@ebouchut

extra_css:
  - css/extra.css

nav:
  - Accueil: index.md
  - Blog: blog/index.md
  - À propos:
      - blog/about/index.md
      - LinkedIn: https://linkedin.com/in/ebouchut
      - GitHub: https://github.com/ebouchut
      - Twitter: https://twitter.com/ebouchut
      - Mastodon: https://ruby.social/@ebouchut
  - CV: blog/cv/index.md
  - Contact:
      - blog/contact/index.md
      - LinkedIn: https://linkedin.com/in/ebouchut
      - GitHub: https://github.com/ebouchut
      - Twitter: https://twitter.com/ebouchut
      - Mastodon: https://ruby.social/@ebouchut
  - Tags: blog/tags.md

repo_url: https://github.com/ebouchut/ebouchut.github.io
repo_name: ebouchut/ebouchut.github.io
